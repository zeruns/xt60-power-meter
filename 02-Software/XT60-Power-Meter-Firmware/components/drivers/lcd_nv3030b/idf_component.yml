## 显示驱动组件依赖
##
## esp_lcd_spd2010：Espressif 官方面板驱动组件。
##   为什么必须用它：该屏的 QSPI 命令必须封装成 opcode<<24|cmd<<8（写命令 0x02、
##   写显存 0x32），且初始化序列是约 200 条的分页式序列，还带 3 条前置命令。
##   自写极易踩坑（本工程曾因此长期黑屏），详见 src/lcd_nv3030b.c 文件头。
##   厂商官方 ESP32 例程驱动同一块屏用的正是这个组件。
dependencies:
  idf: ">=5.5"
  espressif/esp_lcd_spd2010: "^1"
